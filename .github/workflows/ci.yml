name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip pytest PyYAML

      # Windows is in the matrix on purpose. Most of this tool's users are on
      # Windows, and the parts that break there are exactly the parts that
      # matter: read-only files under .git, and backslash paths for Keil.
      - name: Test
        run: python test/run_tests.py

  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build

      # The metadata has to be valid for pip to install this, and a broken
      # pyproject.toml fails at the worst moment: on a user's machine, part way
      # through installing a library.
      - name: Check
        run: python -m twine check dist/*

      # What was built, installed the way a user gets it and then started, from
      # outside the checkout so the source tree cannot stand in for it. A module
      # left out of the package, or a broken entry point, fails here and not on
      # someone's machine. --no-index because it has to need nothing else, and
      # python -m because that is what the README offers when the command is
      # not on the PATH.
      - name: Run what was built
        working-directory: ${{ runner.temp }}
        run: |
          wheel="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          python -m venv fresh
          fresh/bin/python -m pip install --no-index "$wheel"
          expected="stm32-installer $(basename "$wheel" | cut -d- -f2)"
          for got in "$(fresh/bin/stm32-installer --version)" "$(fresh/bin/python -m stm32_installer --version)"; do
            echo "$got"
            test "$got" = "$expected"
          done
