name: Publish to PyPI

# Runs when you publish a GitHub release, so the tag, the release notes and the
# version on PyPI always describe the same thing.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest

    # Named environment, so PyPI can be told to trust only this one. You can
    # also add a required reviewer to it, which makes every release need a
    # human click before it goes out.
    environment:
      name: pypi
      url: https://pypi.org/p/stm32-installer

    # The whole point of trusted publishing. GitHub mints a short lived identity
    # token that PyPI verifies, so there is no API token to store, leak, or
    # remember to rotate.
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
