name: Publish to PyPI

# Runs when a GitHub release is published, so the tag, the release notes and the
# version on PyPI always describe the same thing. A failed run is retried from
# the Actions page with "Re-run failed jobs", so there is no manual trigger.
on:
  release:
    types: [published]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      # PyPI never takes the same version twice, not even after a delete, so a
      # release whose tag does not match the version in the package is stopped
      # here, before anything goes out under the wrong number. The tag may carry
      # a leading v.
      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(basename dist/*.whl | cut -d- -f2)"
          echo "release tag: $tag, package version: $version"
          test "$tag" = "$version"

      # The same check as in CI, run again on exactly what is about to go out:
      # installed on its own from outside the checkout, then started both ways.
      - name: Run what was built
        working-directory: ${{ runner.temp }}
        run: |
          wheel="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          python -m venv fresh
          fresh/bin/python -m pip install --no-index "$wheel"
          expected="stm32-installer $(basename "$wheel" | cut -d- -f2)"
          for got in "$(fresh/bin/stm32-installer --version)" "$(fresh/bin/python -m stm32_installer --version)"; do
            echo "$got"
            test "$got" = "$expected"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest

    # Named, so PyPI can be told to trust this environment and nothing else.
    environment:
      name: pypi
      url: https://pypi.org/p/stm32-installer

    # Trusted publishing. GitHub hands the job a short lived identity that PyPI
    # checks, so there is no API token to store, leak, or remember to rotate.
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Pinned to the commit, not to the tag object. v1.14.2 is an annotated
      # tag, and its own ID (a892a5a...) is not a commit, which Actions cannot
      # check out. dc37677b... is the commit that tag points at.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
